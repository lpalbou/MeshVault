[tool.poetry]
name = "meshvault"
version = "0.3.1"
description = "A professional 3D asset browser for rapid browsing, previewing, and managing OBJ/FBX files"
authors = ["Laurent-Philippe Albou <contact@abstractcore.ai>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/lpalbou/meshvault"
repository = "https://github.com/lpalbou/meshvault"
documentation = "https://github.com/lpalbou/meshvault/tree/main/docs"
keywords = ["3d", "asset-browser", "obj", "fbx", "three.js", "viewer", "meshvault"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Multimedia :: Graphics :: Viewers",
]
packages = [{include = "backend"}]
# Ship exactly what the server needs at runtime. Enumerated on purpose: poetry-core
# force-includes win over `exclude`, so a broad frontend/**/* would drag the ~12 MB of
# test-fixture GLBs and multi-MB source maps into every wheel.
include = [
    { path = "frontend/index.html", format = ["sdist", "wheel"] },
    { path = "frontend/viewer.html", format = ["sdist", "wheel"] },
    { path = "frontend/llms.txt", format = ["sdist", "wheel"] },
    { path = "frontend/llms-full.txt", format = ["sdist", "wheel"] },
    { path = "frontend/css/**/*", format = ["sdist", "wheel"] },
    { path = "frontend/dist/*.js", format = ["sdist", "wheel"] },
    { path = "frontend/vendor/**/*", format = ["sdist", "wheel"] },
]
exclude = [".DS_Store", "frontend/.DS_Store"]

[tool.poetry.dependencies]
python = "^3.10"
# >=0.116 required for starlette>=1.x compatibility (pulled in by the optional mcp extra)
fastapi = ">=0.116,<1.0"
# >=0.31 required by mcp>=1.28; verified running on 0.50.x
uvicorn = {extras = ["standard"], version = ">=0.31,<1.0"}
python-multipart = "^0.0.9"
rarfile = "^4.2"
aiofiles = "^24.1.0"
trimesh = "^4.4.0"
numpy = "^1.26"   # used directly by the MCP shape-compare engine (also a trimesh dep)
# Optional: MCP adapter (agents drive the viewer via Model Context Protocol).
# Install with: pip install "meshvault[mcp]" && playwright install chromium
mcp = {version = ">=1.28", optional = true}
playwright = {version = ">=1.48", optional = true}

[tool.poetry.extras]
mcp = ["mcp", "playwright"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
httpx = "^0.27.0"

[tool.poetry.scripts]
meshvault = "backend.app:main"
meshvault-mcp = "backend.mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: end-to-end / Playwright / WebGL tests (skipped by default)",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
