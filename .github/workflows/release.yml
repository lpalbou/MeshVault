name: Release

# Tag-driven release: push a v*.*.* tag (or dispatch manually) and this workflow
# tests, builds the frontend bundles + Python distributions, publishes to PyPI via
# OIDC trusted publishing (environment: pypi — no long-lived token), and creates the
# GitHub Release with the CHANGELOG entry as notes. Publishing the GitHub Release
# then triggers pages.yml, which redeploys the live web viewer.
#
# One-time external setup (already done per project owner):
# - PyPI project "meshvault" trusts this repo + release.yml + environment "pypi".
# - GitHub environment "pypi" exists.
#
# Rehearsal without publishing: run workflow_dispatch with publish=false.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, with or without the leading v (example: 0.3.0)"
        required: true
        type: string
      publish:
        description: "Publish to PyPI and create a GitHub Release"
        required: true
        type: boolean
        default: false
      publish_confirmation:
        description: "Required when publish=true: publish-meshvault-<version>"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Install dependencies
        run: poetry install --no-root
      - name: Run tests
        run: poetry run pytest tests/ -q

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: [test]
    outputs:
      version: ${{ steps.release-meta.outputs.version }}
      tag: ${{ steps.release-meta.outputs.tag }}
      should_publish: ${{ steps.release-meta.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install build tools
        run: |
          python -m pip install -U pip
          python -m pip install build twine
      - name: Validate tag, version, and changelog
        id: release-meta
        env:
          RELEASE_INPUT_VERSION: ${{ github.event.inputs.version || '' }}
          RELEASE_INPUT_PUBLISH: ${{ github.event.inputs.publish || '' }}
          RELEASE_INPUT_CONFIRMATION: ${{ github.event.inputs.publish_confirmation || '' }}
        run: |
          python - <<'PY'
          import os
          import re
          import urllib.error
          import urllib.request
          from pathlib import Path

          version_input = os.environ.get("RELEASE_INPUT_VERSION", "").strip()
          publish_input = os.environ.get("RELEASE_INPUT_PUBLISH", "").strip().lower()
          confirmation = os.environ.get("RELEASE_INPUT_CONFIRMATION", "").strip()
          event_name = os.environ["GITHUB_EVENT_NAME"].strip()
          ref_name = os.environ["GITHUB_REF_NAME"].strip()
          raw_version = version_input or ref_name
          version = raw_version[1:] if raw_version.startswith("v") else raw_version
          if not re.fullmatch(r"\d+\.\d+\.\d+(?:[a-zA-Z0-9.-]+)?", version):
              raise SystemExit(f"Invalid release version: {raw_version!r}")
          tag = f"v{version}"

          # Version lives in pyproject.toml ([tool.poetry] version).
          pyproject = Path("pyproject.toml").read_text(encoding="utf-8")
          version_match = re.search(r'^version\s*=\s*"([^"]+)"', pyproject, re.MULTILINE)
          if not version_match:
              raise SystemExit("Could not find version in pyproject.toml")
          package_version = version_match.group(1)
          if version != package_version:
              raise SystemExit(
                  f"Tag version {version!r} does not match pyproject version {package_version!r}"
              )

          should_publish = event_name != "workflow_dispatch" or publish_input == "true"
          if event_name == "workflow_dispatch" and should_publish:
              expected = f"publish-meshvault-{version}"
              if confirmation != expected:
                  raise SystemExit(
                      "Manual publish requires publish_confirmation="
                      f"{expected!r}; got {confirmation!r}"
                  )
          if event_name != "workflow_dispatch" and ref_name != tag:
              raise SystemExit(f"Tag trigger ref {ref_name!r} does not match expected {tag!r}")

          # Changelog headers use an em dash: "## [x.y.z] — date" (accept -, – or —).
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          header = re.search(
              rf"^## \[{re.escape(version)}\] [—–-] .+$", changelog, re.MULTILINE)
          if not header:
              raise SystemExit(f"CHANGELOG.md has no entry for {version}")

          rest = changelog[header.end():]
          next_header = re.search(r"^## \[", rest, re.MULTILINE)
          notes = rest[: next_header.start() if next_header else len(rest)].strip()
          if not notes:
              raise SystemExit(f"CHANGELOG.md entry for {version} is empty")

          if should_publish:
              url = f"https://pypi.org/pypi/meshvault/{version}/json"
              try:
                  with urllib.request.urlopen(url, timeout=10):
                      raise SystemExit(
                          f"PyPI already has meshvault {version}; refusing duplicate publish")
              except urllib.error.HTTPError as exc:
                  if exc.code != 404:
                      raise

          Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
          github_output = Path(os.environ["GITHUB_OUTPUT"])
          with github_output.open("a", encoding="utf-8") as fh:
              print(f"version={version}", file=fh)
              print(f"tag={tag}", file=fh)
              print(f"should_publish={str(should_publish).lower()}", file=fh)
          PY
      - name: Build frontend bundles
        # The wheel ships frontend/** including the esbuild bundles — rebuild them from
        # source so the published package always matches the tagged code, regardless of
        # whether the committed dist/ artifacts were regenerated before tagging.
        run: |
          npm ci
          npm run build
      - name: Build Python distributions
        run: python -m build
      - name: Check distributions
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  ensure-tag:
    name: Ensure release tag
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.should_publish == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create annotated tag for manual releases
        if: github.event_name == 'workflow_dispatch'
        run: |
          tag="${{ needs.build.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            # Idempotent: an existing tag is fine IF it points at the commit we are
            # releasing (retry after a partial failure); anything else is an error.
            remote_sha=$(git ls-remote origin "refs/tags/${tag}" | cut -f1)
            resolved=$(git rev-parse "${remote_sha}^{commit}" 2>/dev/null || echo "${remote_sha}")
            if [ "${resolved}" = "${GITHUB_SHA}" ]; then
              echo "Tag ${tag} already exists and matches this commit — continuing."
              exit 0
            fi
            echo "Tag ${tag} exists but points at ${resolved}, not ${GITHUB_SHA}."
            echo "Move or delete the tag first if you intend to re-release this version."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "MeshVault ${tag}"
          git push origin "${tag}"
      - name: Tag already supplied by push trigger
        if: github.event_name != 'workflow_dispatch'
        run: echo "Using existing tag ${{ needs.build.outputs.tag }}"

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build, ensure-tag]
    if: needs.build.outputs.should_publish == 'true'
    environment:
      name: pypi
      url: https://pypi.org/project/meshvault/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, ensure-tag, publish-pypi]
    if: needs.build.outputs.should_publish == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: .
      # Publishing this release fires pages.yml (release: published), which redeploys
      # the live web viewer — no separate docs job needed here.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: MeshVault ${{ needs.build.outputs.tag }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
