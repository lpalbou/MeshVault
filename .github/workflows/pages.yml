name: Deploy viewer to GitHub Pages

# Builds the standalone, server-less MeshVault viewer and publishes the static site in
# web/ to the `gh-pages` branch. Runs on pushes to main that touch the viewer/site, and
# can be triggered manually.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "frontend/js/**"
      - "scripts/build.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Least-privilege: only allow writing to the repo contents (for the gh-pages branch).
permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build the standalone viewer bundle
        run: npm run build

      - name: Assemble the static site
        # web/index.html + the freshly built web/meshvault-viewer.js. A .nojekyll file
        # stops GitHub Pages' Jekyll from touching the assets.
        run: |
          mkdir -p site
          cp web/index.html site/index.html
          cp web/meshvault-viewer.js site/meshvault-viewer.js
          touch site/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          # Neutral committer identity — no self-attribution.
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "Deploy viewer site"
