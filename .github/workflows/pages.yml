name: Deploy viewer to GitHub Pages

# Builds the standalone, server-less MeshVault viewer and publishes web/ to GitHub Pages
# via the official GitHub Actions deployment (Pages source = "GitHub Actions"). This is
# GitHub's recommended path for built (non-Jekyll) sites: the deploy happens in THIS run
# (visible + retryable) instead of a hidden native branch-rebuild.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "frontend/js/**"
      - "scripts/build.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  # Also redeploy whenever a GitHub Release is published (covers tag/release-based
  # releases that don't touch the paths above on main).
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; let an in-progress production deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build the standalone viewer bundle
        run: npm run build

      - name: Assemble the static site
        # web/index.html + the freshly built web/meshvault-viewer.js. .nojekyll stops
        # GitHub Pages' Jekyll from touching the assets.
        run: |
          mkdir -p site
          cp web/index.html site/index.html
          cp web/meshvault-viewer.js site/meshvault-viewer.js
          cp web/sample.glb site/sample.glb
          cp -r frontend/vendor site/vendor   # Draco/Basis decoders for compressed glTF
          touch site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    permissions:
      pages: write        # create the Pages deployment
      id-token: write     # OIDC verification for deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
