<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MeshVault Viewer — light 3D viewer</title>
    <meta name="description" content="A fast, local, server-less 3D model viewer. Drag & drop or open a URL: OBJ, FBX, glTF/GLB, STL, PLY, DAE, 3MF, USDZ." />
    <!-- Open Graph for shared links -->
    <meta property="og:title" content="MeshVault Viewer" />
    <meta property="og:description" content="Drag & drop a 3D model (glTF/GLB, OBJ, FBX, STL, PLY, DAE, 3MF, USDZ) — runs entirely in your browser." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234a9eff' stroke-width='2'><path d='M12 2L2 7l10 5 10-5-10-5z'/><path d='M2 17l10 5 10-5'/><path d='M2 12l10 5 10-5'/></svg>" />
    <style>
        :root { --accent:#4a9eff; --bg:#0d0d1a; --panel:rgba(20,20,30,.86); --border:#2a2a3a; --text:#e6e6ee; --muted:#9aa0b0; }
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; overflow: hidden; }
        #app { position: absolute; inset: 0; }
        header { position: absolute; top: 0; left: 0; right: 0; z-index: 10; display: flex;
            align-items: center; gap: 10px; padding: 10px 14px; pointer-events: none; }
        .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; pointer-events: auto; }
        .brand svg { color: var(--accent); }
        .brand small { font-weight: 400; color: var(--muted); }
        .spacer { flex: 1; }
        .bar { display: flex; gap: 6px; align-items: center; pointer-events: auto; flex-wrap: wrap; justify-content: flex-end; }
        .bar input[type=text] { width: min(46vw, 340px); padding: 7px 10px; border-radius: 8px;
            background: #141420; color: var(--text); border: 1px solid var(--border); font-size: 13px; }
        button { padding: 7px 11px; border-radius: 8px; background: #1b1b2a; color: var(--text);
            border: 1px solid var(--border); cursor: pointer; font-size: 13px; }
        button:hover { border-color: var(--accent); }
        button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
        .badge { display: inline-block; min-width: 1.1em; text-align: center; }
        #status { position: absolute; left: 14px; bottom: 12px; z-index: 10; font-size: 12px;
            color: var(--muted); background: var(--panel); padding: 6px 10px; border-radius: 8px;
            border: 1px solid var(--border); max-width: 60vw; }
        #placeholder { position: absolute; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 10px; color: var(--muted);
            text-align: center; padding: 20px; z-index: 5; }
        #placeholder svg { opacity: .3; }
        #placeholder .formats { font-size: 12px; opacity: .7; max-width: 520px; }
        #drophint { position: absolute; inset: 16px; z-index: 8; display: none; align-items: center;
            justify-content: center; border: 2px dashed var(--accent); border-radius: 14px;
            background: rgba(74,158,255,.08); color: var(--accent); font-size: 20px; font-weight: 700;
            pointer-events: none; }
        body.dragging #drophint { display: flex; }
        #help { position: absolute; right: 14px; bottom: 12px; z-index: 10; font-size: 11px;
            color: var(--muted); text-align: right; line-height: 1.5; }
        /* Lighting panel */
        #light-panel { position: absolute; top: 56px; right: 14px; z-index: 12; width: 240px;
            background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
            display: none; overflow: hidden; }
        #light-panel.open { display: block; }
        .lp-head { padding: 9px 12px; border-bottom: 1px solid var(--border); font-size: 12px;
            font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
        .lp-body { padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
        .lp-body label { font-size: 11px; font-weight: 600; color: var(--muted); margin-top: 4px; }
        .lp-row { display: flex; align-items: center; gap: 8px; }
        .lp-row > span:first-child { width: 12px; font-size: 11px; color: var(--muted); }
        .lp-row input[type=range] { flex: 1; accent-color: var(--accent); }
        .lp-val { width: 42px; text-align: right; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
        #lp-reset { margin-top: 8px; }
        #btn-lights.active { background: var(--accent); border-color: var(--accent); color: #fff; }
        @media (max-width: 640px) { .bar input[type=text] { width: 40vw; } .brand small { display:none; } }
    </style>
</head>
<body>
    <div id="app"></div>
    <div id="drophint">Drop a 3D model to view</div>

    <div id="placeholder">
        <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
            <path d="M12 2L2 7l10 5 10-5-10-5z" /><path d="M2 17l10 5 10-5" /><path d="M2 12l10 5 10-5" />
        </svg>
        <div style="font-size:16px;color:var(--text)">Drag &amp; drop a 3D model, or open a URL</div>
        <div class="formats">OBJ · FBX · glTF / GLB · STL · PLY · DAE · 3MF · USDZ — everything runs in your browser, nothing is uploaded.</div>
        <button class="primary" id="try-sample">Load a sample model</button>
    </div>

    <header>
        <div class="brand">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2L2 7l10 5 10-5-10-5z" /><path d="M2 17l10 5 10-5" /><path d="M2 12l10 5 10-5" />
            </svg>
            <span>MeshVault</span> <small>viewer</small>
        </div>
        <div class="spacer"></div>
        <div class="bar">
            <input type="text" id="url" placeholder="Paste a model URL (glb, obj, …)" />
            <button id="open-url">Open</button>
            <button id="open-file">File…</button>
            <button id="btn-front" title="Auto-find the best/front view">Front</button>
            <button id="btn-mode" title="Cycle render mode: mesh+texture → mesh → wireframe">Mode <span class="badge" id="mode-badge">T</span></button>
            <button id="btn-lights" title="Lighting">☀ Lights</button>
            <button id="btn-shot" title="Download a PNG screenshot">Shot</button>
            <button id="btn-full" title="Fullscreen">⤢</button>
        </div>
    </header>

    <!-- Lighting panel (mirrors MeshVault's light controls) -->
    <div id="light-panel">
        <div class="lp-head">Lighting</div>
        <div class="lp-body">
            <label>Direction</label>
            <div class="lp-row"><span>H</span><input type="range" id="lp-azimuth" min="0" max="360" step="1" value="45"><span class="lp-val" id="lp-azimuth-v">45°</span></div>
            <div class="lp-row"><span>V</span><input type="range" id="lp-elevation" min="5" max="90" step="1" value="60"><span class="lp-val" id="lp-elevation-v">60°</span></div>
            <label>Key light</label>
            <div class="lp-row"><input type="range" id="lp-key" min="0" max="3" step="0.05" value="1.2"><span class="lp-val" id="lp-key-v">1.20</span></div>
            <label>Fill light</label>
            <div class="lp-row"><input type="range" id="lp-fill" min="0" max="2" step="0.05" value="0.5"><span class="lp-val" id="lp-fill-v">0.50</span></div>
            <label>Ambient</label>
            <div class="lp-row"><input type="range" id="lp-ambient" min="0" max="2" step="0.05" value="0.3"><span class="lp-val" id="lp-ambient-v">0.30</span></div>
            <label>Exposure (brightness)</label>
            <div class="lp-row"><input type="range" id="lp-exposure" min="0.3" max="4" step="0.05" value="1.2"><span class="lp-val" id="lp-exposure-v">1.20</span></div>
            <button id="lp-reset">Reset</button>
        </div>
    </div>

    <div id="status">Ready.</div>
    <div id="help">Drag: orbit · Scroll: zoom · Right-drag: pan · Space: reset</div>
    <input type="file" id="file" accept=".obj,.fbx,.gltf,.glb,.stl,.ply,.dae,.3mf,.usdz" style="display:none" />

    <script type="module">
        import { createViewer } from "./meshvault-viewer.js";

        const $ = (id) => document.getElementById(id);
        const statusEl = $("status");
        const setStatus = (t) => { statusEl.textContent = t; };
        const placeholder = $("placeholder");

        const mv = createViewer($("app"), {
            onEvent: (data, event) => {
                if (event === "loaded") { placeholder.style.display = "none"; setStatus("Loaded: " + (data.name || "model")); }
                if (event === "error") setStatus("Error: " + (data.error || "load failed"));
            },
        });
        window.mv = mv; // expose for the console / embedders / agents

        async function loadUrl(url) {
            if (!url) return;
            setStatus("Loading " + url + " …");
            const r = await mv.execute({ action: "load", params: { url } });
            if (!r.ok) { setStatus("Failed: " + r.error); return; }
            await mv.execute({ action: "find_best_view", params: { fill: 0.85 } });
        }

        // --- file input + drag/drop (client-only, nothing uploaded) ---
        $("open-file").addEventListener("click", () => $("file").click());
        $("file").addEventListener("change", async (e) => {
            const f = e.target.files[0];
            if (!f) return;
            setStatus("Loading " + f.name + " …");
            const r = await mv.loadFile(f);
            if (r && r.ok === false) setStatus("Failed: " + r.error);
            else { placeholder.style.display = "none"; await mv.execute({ action: "find_best_view", params: { fill: 0.85 } }); }
        });
        const dropReset = (() => { let t; return () => { document.body.classList.add("dragging"); clearTimeout(t); t = setTimeout(() => document.body.classList.remove("dragging"), 120); }; })();
        window.addEventListener("dragover", (e) => { if (e.dataTransfer && [...e.dataTransfer.types].includes("Files")) { e.preventDefault(); dropReset(); } });
        window.addEventListener("drop", async (e) => {
            e.preventDefault(); document.body.classList.remove("dragging");
            const f = e.dataTransfer.files[0];
            if (!f) return;
            setStatus("Loading " + f.name + " …");
            const r = await mv.loadFile(f);
            if (r && r.ok === false) setStatus("Failed: " + r.error);
            else { placeholder.style.display = "none"; await mv.execute({ action: "find_best_view", params: { fill: 0.85 } }); }
        });

        // --- toolbar ---
        $("open-url").addEventListener("click", () => loadUrl($("url").value.trim()));
        $("url").addEventListener("keydown", (e) => { if (e.key === "Enter") loadUrl($("url").value.trim()); });
        $("try-sample").addEventListener("click", () => {
            // A small, permissively-licensed sample from the glTF sample models CDN.
            const url = "https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/Duck/glTF-Binary/Duck.glb";
            $("url").value = url; loadUrl(url);
        });
        $("btn-front").addEventListener("click", () => mv.execute({ action: "find_best_view", params: { fill: 0.85 } }));
        const modes = [["textured","T"],["solid","M"],["wireframe","W"]]; let mi = 0;
        $("btn-mode").addEventListener("click", async () => {
            mi = (mi + 1) % modes.length;
            await mv.execute({ action: "set_render_mode", params: { mode: modes[mi][0] } });
            $("mode-badge").textContent = modes[mi][1];
        });
        $("btn-shot").addEventListener("click", async () => {
            const r = await mv.execute({ action: "screenshot", params: { width: 1600, height: 1600 } });
            if (!r.ok) return;
            const a = document.createElement("a"); a.href = r.result; a.download = "meshvault.png"; a.click();
        });
        $("btn-full").addEventListener("click", () => {
            if (document.fullscreenElement) document.exitFullscreen();
            else document.documentElement.requestFullscreen?.();
        });

        // --- Lighting panel (same controls as MeshVault) ---
        const lp = $("light-panel");
        const lightDefaults = { azimuth: 45, elevation: 60, key: 1.2, fill: 0.5, ambient: 0.3, exposure: 1.2 };
        // slider id -> { el, val, fmt, param }  (param = set_lighting field)
        const lightMap = {
            azimuth:   { param: "azimuth",        fmt: (v) => `${Math.round(v)}°` },
            elevation: { param: "elevation",      fmt: (v) => `${Math.round(v)}°` },
            key:       { param: "key_intensity",  fmt: (v) => v.toFixed(2) },
            fill:      { param: "fill_intensity", fmt: (v) => v.toFixed(2) },
            ambient:   { param: "ambient",        fmt: (v) => v.toFixed(2) },
            exposure:  { param: "exposure",       fmt: (v) => v.toFixed(2) },
        };
        const applyLight = (key, value) => {
            const m = lightMap[key];
            $(`lp-${key}-v`).textContent = m.fmt(value);
            mv.execute({ action: "set_lighting", params: { [m.param]: value } });
        };
        for (const key of Object.keys(lightMap)) {
            $(`lp-${key}`).addEventListener("input", (e) => applyLight(key, parseFloat(e.target.value)));
        }
        // Sync the sliders to the viewer's current lighting when the panel opens.
        const syncLightPanel = async () => {
            const r = await mv.execute({ action: "get_lighting" });
            if (!r.ok) return;
            const s = r.result;
            const cur = { azimuth: s.keyAzimuth, elevation: s.keyElevation, key: s.keyIntensity,
                          fill: s.fillIntensity, ambient: s.ambientIntensity, exposure: s.exposure };
            for (const key of Object.keys(lightMap)) {
                $(`lp-${key}`).value = cur[key];
                $(`lp-${key}-v`).textContent = lightMap[key].fmt(cur[key]);
            }
        };
        $("btn-lights").addEventListener("click", async () => {
            const open = !lp.classList.contains("open");
            lp.classList.toggle("open", open);
            $("btn-lights").classList.toggle("active", open);
            if (open) await syncLightPanel();
        });
        $("lp-reset").addEventListener("click", async () => {
            await mv.execute({ action: "set_lighting", params: {
                azimuth: lightDefaults.azimuth, elevation: lightDefaults.elevation,
                key_intensity: lightDefaults.key, fill_intensity: lightDefaults.fill,
                ambient: lightDefaults.ambient, exposure: lightDefaults.exposure,
            } });
            await syncLightPanel();
        });

        // --- shareable state: ?src=<url> loads a model on open ---
        const params = new URLSearchParams(location.search);
        const src = params.get("src");
        if (src) { $("url").value = src; loadUrl(src); }
    </script>
</body>
</html>
